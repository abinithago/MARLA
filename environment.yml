name: marla_env
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.9.7
  - pip
  - pip:
    # Core deep learning
    - torch==1.13.0
    - torchvision==0.14.0
    - transformers==4.24.0
    
    # Dataset and data processing
    - wilds==2.0.0
    - pandas==1.3.2
    - numpy==1.21.6
    - pillow>=8.0.0
    - scikit-learn==0.24.1
    - scipy==1.7.0
    
    # Utilities
    - tqdm>=4.60.0
    - pyyaml>=5.4.0
    
    # Optional but recommended
    - wandb>=0.12.0
    - matplotlib>=3.3.0
    - seaborn>=0.11.0
